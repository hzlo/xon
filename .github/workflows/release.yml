name: Release XON

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本标签 (例如 v0.1.0)'
        required: false
        default: ''

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并创建 GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v0.1.0' }}
          releaseName: 'XON ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v0.1.0' }}'
          releaseDraft: false
          prerelease: false

      - name: 打包免安装便携版 (Portable ZIP)
        shell: pwsh
        run: |
          Compress-Archive -Path "src-tauri/target/release/xon.exe" -DestinationPath "xon-portable-windows-x64.zip" -Force
          $TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v0.1.0' }}"
          gh release upload $TAG xon-portable-windows-x64.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

